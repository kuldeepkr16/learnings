<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marathi Shabd Cards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#7a2e1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marathi Cards">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="description" content="Learn everyday Marathi with five-card sets that mix new words with recent revision; tap a card to reveal the Marathi word, pronunciation, and a short sentence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: a short masthead, one control row, then a wrapping grid of five flip cards sized like playing cards. */
  :root {
    --bg: #f6efe4;
    --bg-deep: #ecdfcc;
    --card: #fffaf2;
    --card-back: #7a2e1d;
    --card-back-ink: #fff4e6;
    --card-back-soft: #f1c9a4;
    --fg: #2b1d14;
    --muted: #7d6a5b;
    --rule: #d9c7b0;
    --accent: #c2541c;
    --accent-ink: #fff7ef;
    --shadow: 0 10px 28px rgba(80, 40, 10, 0.16);
    --font-display: "Baloo 2", "Noto Sans Devanagari", system-ui, sans-serif;
    --font-dev: "Noto Sans Devanagari", "Mangal", "Kohinoor Devanagari", system-ui, sans-serif;
    --font-body: "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1512; --bg-deep: #150f0c; --card: #2a201b; --card-back: #5c2416;
      --card-back-ink: #fff1e2; --card-back-soft: #e6b48c; --fg: #f3e8db; --muted: #b19d8c;
      --rule: #4a3a30; --accent: #e8773b; --accent-ink: #1c1512;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.45); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1512; --bg-deep: #150f0c; --card: #2a201b; --card-back: #5c2416;
    --card-back-ink: #fff1e2; --card-back-soft: #e6b48c; --fg: #f3e8db; --muted: #b19d8c;
    --rule: #4a3a30; --accent: #e8773b; --accent-ink: #1c1512;
    --shadow: 0 10px 28px rgba(0, 0, 0, 0.45); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
    background: var(--bg);
    background-image: radial-gradient(circle at 50% -10%, var(--bg-deep), transparent 60%);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  body { padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  .wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 22px; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.9rem, 4vw, 2.6rem);
    line-height: 1.05;
    margin: 0;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  h1 .dev { font-family: var(--font-dev); font-weight: 700; color: var(--accent); }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; max-width: 46ch; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .search {
    display: flex;
    width: min(100%, 620px);
    gap: 10px;
  }
  .search input {
    min-width: 0;
    flex: 1;
    font: 500 1rem var(--font-body);
    color: var(--fg);
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 11px 18px;
    box-shadow: 0 3px 12px rgba(80, 40, 10, 0.08);
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .search button { white-space: nowrap; }
  .search-clear {
    border: 0;
    padding: 8px 4px;
    color: var(--accent);
    background: transparent;
    font: 600 0.95rem var(--font-body);
    cursor: pointer;
  }
  .search-clear[hidden] { display: none; }
  button.primary {
    font: 600 1rem var(--font-body);
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(194, 84, 28, 0.3);
    transition: transform 120ms ease, filter 120ms ease;
  }
  button.primary:hover { filter: brightness(1.06); }
  button.primary:active { transform: translateY(1px); }
  button.primary:focus-visible, .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .hint { color: var(--muted); font-size: 0.9rem; }
  .count { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; margin-left: auto; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 18px;
  }
  @media (max-width: 600px) {
    .search { gap: 8px; }
    .search input { padding-inline: 14px; }
    .search button.primary { padding-inline: 17px; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .card { aspect-ratio: auto; height: 220px; }
    .front .word { font-size: 1.6rem; }
    .back .mr { font-size: 1.9rem; }
    .back .ex { font-size: 0.88rem; }
    .back .ex .dv { font-size: 1.02rem; }
    header .controls { display: none; }
    .fab {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      display: flex; justify-content: center;
      padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
      background: linear-gradient(to top, var(--bg) 70%, transparent);
    }
    .fab button.primary { width: 100%; max-width: 420px; padding: 15px 22px; font-size: 1.05rem; }
    body { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  }
  .fab { display: none; }
  @media (max-width: 600px) { .fab { display: flex; } }

  .card {
    display: block;
    width: 100%;
    position: relative;
    aspect-ratio: 5 / 7;
    perspective: 1200px;
    cursor: pointer;
    border: 0;
    background: transparent;
    padding: 0;
    text-align: left;
    color: inherit;
    font: inherit;
    border-radius: 18px;
    min-width: 0;
  }
  .inner {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform 520ms cubic-bezier(.2,.7,.2,1);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }
  .card.flipped .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 18px;
    padding: 16px 16px 14px;
    display: flex; flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  .front { background: var(--card); border: 1px solid var(--rule); }
  .back { background: var(--card-back); color: var(--card-back-ink); transform: rotateY(180deg); }

  .chip {
    align-self: flex-start;
    font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--rule);
    border-radius: 999px; padding: 2px 9px;
  }
  .back .chip { color: var(--card-back-soft); border-color: rgba(255,255,255,0.22); }

  .front .word {
    margin-top: auto;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.35rem, 2.6vw, 1.75rem);
    line-height: 1.12;
    overflow-wrap: anywhere;
  }
  .front .hi {
    font-family: var(--font-dev);
    font-weight: 600;
    font-size: 1.25rem;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.3;
  }
  .front .tap { margin-top: auto; font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .front .tap svg { width: 14px; height: 14px; }

  .back .mr {
    margin-top: auto;
    font-family: var(--font-dev);
    font-weight: 700;
    font-size: clamp(1.6rem, 3vw, 2.1rem);
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .back .roman {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--card-back-soft);
    margin-top: 2px;
    overflow-wrap: anywhere;
  }
  .back .ex {
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.18);
    font-size: 0.82rem;
    line-height: 1.4;
    display: grid; gap: 2px;
  }
  .back .ex .dv { font-family: var(--font-dev); font-size: 0.95rem; }
  .back .ex .rm { font-style: italic; color: var(--card-back-soft); }
  .back .ex .en { opacity: 0.85; }

  .status { color: var(--muted); font-size: 0.9rem; }

  @media (prefers-reduced-motion: reduce) {
    .inner { transition: none; }
    button.primary { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Marathi <span class="dev">शब्द</span> Cards</h1>
      <p class="sub">Five everyday words at a time. Tap a card to flip it and see the Marathi word, how to say it, and one short sentence.</p>
    </div>
    <div class="controls">
      <button class="primary" id="nextBtn" type="button">Next 5 words</button>
      <span class="hint">or pull down to refresh</span>
    </div>
  </header>

  <form class="search" id="searchForm" role="search">
    <input id="searchInput" type="search" inputmode="search" autocomplete="off" aria-label="Search the word deck" placeholder="Search in English, Hindi, or Marathi">
    <button class="primary" type="submit">Search</button>
    <button class="search-clear" id="clearSearch" type="button" hidden>Clear</button>
  </form>

  <div class="controls" style="margin-top:-8px">
    <span class="status" id="status">Loading words…</span>
    <span class="count" id="count"></span>
  </div>

  <main class="grid" id="grid" aria-live="polite"></main>

  <div class="fab"><button class="primary" id="nextBtnMobile" type="button">Next 5 words</button></div>

</div>

<script>
(function () {
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const count = document.getElementById('count');
  const nextBtn = document.getElementById('nextBtn');
  const searchForm = document.getElementById('searchForm');
  const searchInput = document.getElementById('searchInput');
  const clearSearch = document.getElementById('clearSearch');
  const PROGRESS_KEY = 'marathi-cards-progress-v2';
  const MAX_RECENT_SETS = 6;
  const packCache = new Map();
  let manifest;
  let searchIndex;
  let currentWords = [];
  let currentStatus = '';
  let progress = { history: [], seenIds: [] };

  function pickRandom(list, amount) {
    const copy = list.slice();
    const out = [];
    while (out.length < amount && copy.length) {
      const i = Math.floor(Math.random() * copy.length);
      out.push(copy.splice(i, 1)[0]);
    }
    return out;
  }

  function shuffle(list) {
    return pickRandom(list, list.length);
  }

  function referenceFor(card) {
    return { id: card.id, pack: card._pack };
  }

  function normalizeReference(value) {
    if (value && typeof value === 'object' && value.id !== undefined && value.pack) return value;
    const pack = manifest.legacyLocations[String(value)];
    return pack ? { id: value, pack } : null;
  }

  function loadProgress() {
    try {
      const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY) || localStorage.getItem('marathi-cards-progress-v1'));
      if (!saved || !Array.isArray(saved.history) || !Array.isArray(saved.seenIds)) return;
      progress.history = saved.history
        .map(set => Array.isArray(set) ? set.map(normalizeReference).filter(Boolean) : [])
        .filter(set => set.length)
        .slice(-MAX_RECENT_SETS);
      progress.seenIds = [...new Set(saved.seenIds.map(String))];
    } catch (_) {
      progress = { history: [], seenIds: [] };
    }
  }

  function saveProgress() {
    try {
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
    } catch (_) {
      // The learning sequence still works for this session when storage is unavailable.
    }
  }

  function rememberSet(set) {
    const references = set.map(referenceFor);
    progress.history.push(references);
    progress.history = progress.history.slice(-MAX_RECENT_SETS);
    progress.seenIds = [...new Set([...progress.seenIds, ...set.map(word => String(word.id))])];
    saveProgress();
  }

  async function loadPack(file) {
    if (!packCache.has(file)) {
      packCache.set(file, fetch(file).then(response => {
        if (!response.ok) throw new Error('Could not load ' + file);
        return response.json();
      }).then(cards => cards.map(card => Object.assign(card, { _pack: file }))).catch(error => {
        packCache.delete(file);
        throw error;
      }));
    }
    return packCache.get(file);
  }

  async function loadReferences(references) {
    const files = [...new Set(references.map(reference => reference.pack))];
    const packs = (await Promise.all(files.map(loadPack))).flat();
    const byKey = new Map(packs.map(card => [String(card.id), card]));
    return references.map(reference => byKey.get(String(reference.id))).filter(Boolean);
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function cardFor(w) {
    const card = el('button', 'card');
    card.type = 'button';
    card.setAttribute('aria-label', w.en + ' — tap to see the Marathi word');
    const inner = el('div', 'inner');

    const front = el('div', 'face front');
    front.appendChild(el('span', 'chip', w.category));
    front.appendChild(el('div', 'word', w.en));
    front.appendChild(el('div', 'hi', w.hi));
    const tap = el('div', 'tap');
    tap.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg><span>Tap to flip</span>';
    front.appendChild(tap);

    const back = el('div', 'face back');
    back.appendChild(el('span', 'chip', 'मराठी'));
    back.appendChild(el('div', 'mr', w.mr));
    back.appendChild(el('div', 'roman', w.mr_roman));
    const ex = el('div', 'ex');
    if (w.example) {
      ex.appendChild(el('div', 'dv', w.example.mr));
      ex.appendChild(el('div', 'rm', w.example.roman));
      ex.appendChild(el('div', 'en', w.example.en));
    } else {
      ex.appendChild(el('div', 'en', 'Word type: ' + (w.part_of_speech || w.category)));
      ex.appendChild(el('div', 'rm', 'Source: ' + (w.source || 'Marathi Shabd Cards')));
    }
    back.appendChild(ex);

    inner.appendChild(front);
    inner.appendChild(back);
    card.appendChild(inner);
    card.addEventListener('click', () => card.classList.toggle('flipped'));
    return card;
  }

  function renderCurrent() {
    grid.replaceChildren(...currentWords.map(cardFor));
    status.textContent = currentStatus;
  }

  function chooseCategories(amount, excluded = new Set()) {
    const available = manifest.categories.filter(category => !excluded.has(category.id));
    return pickRandom(available, Math.min(amount, available.length));
  }

  async function cardFromCategory(category, excludedIds, unseenOnly = true) {
    const shards = pickRandom(category.shards, category.shards.length);
    const seen = new Set(progress.seenIds);
    for (const shard of shards) {
      let cards;
      try {
        cards = await loadPack(shard.file);
      } catch (_) {
        continue;
      }
      const candidates = cards.filter(card => !excludedIds.has(String(card.id)) && (!unseenOnly || !seen.has(String(card.id))));
      if (candidates.length) return pickRandom(candidates, 1)[0];
    }
    return null;
  }

  async function pickLearningCards(amount, excludedIds) {
    const selected = [];
    const selectedCategories = new Set();
    const preferredCategories = chooseCategories(amount);
    const preferredCards = await Promise.all(preferredCategories.map(category =>
      cardFromCategory(category, new Set(excludedIds), true)));
    preferredCategories.forEach(category => selectedCategories.add(category.id));
    for (const card of preferredCards.filter(Boolean)) {
      selected.push(card);
      excludedIds.add(String(card.id));
    }
    if (selected.length < amount) {
      for (const category of chooseCategories(manifest.categories.length, selectedCategories)) {
        if (selected.length >= amount) break;
        const card = await cardFromCategory(category, excludedIds, false);
        if (card) {
          selected.push(card);
          excludedIds.add(String(card.id));
        }
      }
    }
    if (selected.length < amount) {
      const loadedCards = (await Promise.all([...packCache.values()].map(promise => promise.catch(() => [])))).flat();
      const seen = new Set(progress.seenIds);
      const unseenLoaded = loadedCards.filter(card => !excludedIds.has(String(card.id)) && !seen.has(String(card.id)));
      const anyLoaded = loadedCards.filter(card => !excludedIds.has(String(card.id)));
      for (const card of pickRandom(unseenLoaded.length ? unseenLoaded : anyLoaded, amount - selected.length)) {
        selected.push(card);
        excludedIds.add(String(card.id));
      }
    }
    return selected;
  }

  async function startFirstSet() {
    currentWords = await pickLearningCards(5, new Set());
    currentStatus = '5 new words. Tap any card to flip it.';
    rememberSet(currentWords);
    renderCurrent();
  }

  async function nextLearningSet() {
    const previousReferences = progress.history.at(-1) || [];
    const previousIds = new Set(previousReferences.map(reference => String(reference.id)));
    const immediateReview = pickRandom(currentWords, 1);
    const selectedIds = new Set(immediateReview.map(word => String(word.id)));
    const olderReferences = progress.history.slice(0, -1).flat()
      .filter(reference => !previousIds.has(String(reference.id)) && !selectedIds.has(String(reference.id)));
    let olderPool = olderReferences.length ? await loadReferences(pickRandom(olderReferences, Math.min(20, olderReferences.length))) : [];
    if (!olderPool.length) {
      olderPool = currentWords.filter(word => !selectedIds.has(String(word.id)));
    }
    const olderReview = pickRandom(olderPool.filter(word => !selectedIds.has(String(word.id))), 1);
    olderReview.forEach(word => selectedIds.add(String(word.id)));
    const newWords = await pickLearningCards(3, selectedIds);
    const newWordCount = newWords.length;

    currentWords = shuffle([...immediateReview, ...olderReview, ...newWords]);
    currentStatus = (5 - newWordCount) + ' revision words · ' + newWordCount + ' new words. Tap any card to flip it.';
    rememberSet(currentWords);
    renderCurrent();
  }

  async function searchWords(event) {
    event.preventDefault();
    const query = searchInput.value.trim().toLocaleLowerCase();
    if (!query) {
      clearSearchView();
      return;
    }

    status.textContent = 'Searching the deck…';
    if (!searchIndex) {
      const response = await fetch('data/search-index.json');
      if (!response.ok) throw new Error('Could not load the search index');
      searchIndex = await response.json();
    }
    const exactMatches = searchIndex.filter(row => row.slice(1, 5).some(value => value.toLocaleLowerCase() === query));
    const allMatches = exactMatches.length
      ? exactMatches
      : searchIndex.filter(row => row.slice(1, 5).join(' ').toLocaleLowerCase().includes(query));
    const matchedRows = allMatches.slice(0, 20);
    const packs = (await Promise.all([...new Set(matchedRows.map(row => row[5]))].map(loadPack))).flat();
    const byId = new Map(packs.map(card => [String(card.id), card]));
    const matches = matchedRows.map(row => byId.get(String(row[0]))).filter(Boolean);
    grid.replaceChildren(...matches.map(cardFor));
    clearSearch.hidden = false;
    status.textContent = allMatches.length
      ? (allMatches.length > matches.length ? 'Showing the first 20 of ' + allMatches.length + ' matching cards. Add more letters to narrow the search.'
        : allMatches.length + (allMatches.length === 1 ? ' matching card. Tap it to flip.' : ' matching cards. Tap any card to flip.'))
      : 'No cards found for “' + searchInput.value.trim() + '”.';
  }

  function clearSearchView() {
    searchInput.value = '';
    clearSearch.hidden = true;
    renderCurrent();
    searchInput.focus();
  }

  async function showNextWords() {
    searchInput.value = '';
    clearSearch.hidden = true;
    nextBtn.disabled = true;
    document.getElementById('nextBtnMobile').disabled = true;
    status.textContent = 'Loading the next five words…';
    try {
      await nextLearningSet();
    } catch (error) {
      status.textContent = 'Could not load the next words (' + error.message + ').';
    } finally {
      nextBtn.disabled = false;
      document.getElementById('nextBtnMobile').disabled = false;
    }
  }

  async function start() {
    const response = await fetch('data/manifest.json');
    if (!response.ok) throw new Error('Could not load the deck manifest');
    manifest = await response.json();
    count.textContent = manifest.total.toLocaleString() + ' words in the deck';
    loadProgress();
    nextBtn.addEventListener('click', () => showNextWords());
    document.getElementById('nextBtnMobile').addEventListener('click', async () => { await showNextWords(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    searchForm.addEventListener('submit', event => searchWords(event).catch(error => { status.textContent = 'Search failed (' + error.message + ').'; }));
    clearSearch.addEventListener('click', clearSearchView);
    const latestReferences = progress.history.at(-1) || [];
    currentWords = latestReferences.length ? await loadReferences(latestReferences) : [];
    if (currentWords.length === 5) {
      currentStatus = 'Your latest set. Tap any card to flip it.';
      renderCurrent();
    } else {
      await startFirstSet();
    }
  }

  start().catch(error => { status.textContent = 'Could not start the deck (' + error.message + ').'; });
})();
// Offline support for the home-screen app; skipped where service workers are unavailable (e.g. the artifact preview).
